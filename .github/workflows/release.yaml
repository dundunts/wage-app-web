name: Publish immutable web release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: web-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-and-promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete source history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate immutable release tag and ancestry
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-U[1-9][0-9]*)?$ ]]
          [[ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" == tag ]]
          release_version=${version%%-U*}
          git fetch origin "release/$release_version"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/release/$release_version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - name: Install and verify release source once
        run: |
          set -euo pipefail
          npm ci
          bash tests/release-contract.sh
          bash tests/verify-docker-tag.sh
          npm run lint
          npm run typecheck
          npm run build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Refuse an existing version tag
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE: docker.io/${{ secrets.DOCKER_USERNAME }}/wage-app-web
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/verify-docker-tag.sh require-absent "$IMAGE" "$VERSION"
          bash scripts/verify-docker-tag.sh require-absent "$IMAGE" "git-$GITHUB_SHA"
      - name: Define immutable image metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: docker.io/${{ secrets.DOCKER_USERNAME }}/wage-app-web
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,prefix=git-,format=long
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - name: Build and publish image once
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: linux/amd64
      - name: Verify published digest and tags
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE: docker.io/${{ secrets.DOCKER_USERNAME }}/wage-app-web
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$IMAGE@$DIGEST" >/dev/null
          bash scripts/verify-docker-tag.sh require-digest "$IMAGE" "$VERSION" "$DIGEST"
          bash scripts/verify-docker-tag.sh require-digest "$IMAGE" "git-$GITHUB_SHA" "$DIGEST"
      - name: Create narrowly scoped infrastructure token
        id: infra-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: dundunts
          repositories: wage-app-infr
          permission-contents: write
          permission-pull-requests: write
      - name: Check out infrastructure desired state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dundunts/wage-app-infr
          ref: main
          path: infra
          token: ${{ steps.infra-token.outputs.token }}
      - name: Open image-only infrastructure pull request
        env:
          GH_TOKEN: ${{ steps.infra-token.outputs.token }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE: docker.io/${{ secrets.DOCKER_USERNAME }}/wage-app-web
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cd infra
          [[ "$IMAGE" == "docker.io/dundunts/wage-app-web" ]]
          ruby -ryaml -e '
            path, version, digest = ARGV
            values = YAML.safe_load(File.read(path), permitted_classes: [], permitted_symbols: [], aliases: false)
            values.fetch("image")["version"] = version
            values.fetch("image")["digest"] = digest
            File.write(path, YAML.dump(values))
          ' environments/production/web.yaml "$VERSION" "$DIGEST"
          branch="release/web-$VERSION-$GITHUB_RUN_ID"
          git checkout -b "$branch"
          git config user.name "wage-app-release-promoter[bot]"
          git config user.email "wage-app-release-promoter[bot]@users.noreply.github.com"
          git add environments/production/web.yaml
          git commit -m "Promote web $VERSION"
          git push origin "$branch"
          body_file=$(mktemp)
          trap 'rm -f "$body_file"' EXIT
          printf '%s\n' \
            'Refs dundunts/wage-app-infr#9' \
            '' \
            'Automated immutable web promotion.' \
            '' \
            "- Source: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SOURCE_SHA" \
            "- Version: $VERSION" \
            "- Image: $IMAGE@$DIGEST" \
            '- Scope: environments/production/web.yaml image.version + image.digest only' > "$body_file"
          gh pr create --repo dundunts/wage-app-infr --base main --head "$branch" \
            --title "Promote web $VERSION" --body-file "$body_file"
